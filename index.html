<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: pointer;
    }

    #deck {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 300ms ease-in-out, transform 300ms ease-in-out;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .slide.leaving {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* Slide content */
    .slide-content {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    .accent-line {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #4a9eff, #7c5af5);
      border-radius: 1px;
      margin: 0 auto 32px;
    }

    .slide-content h1 {
      font-size: clamp(32px, 6vw, 64px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.1;
      color: #fff;
      margin-bottom: 20px;
    }

    .slide-content h2 {
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 16px;
    }

    .slide-content h3 {
      font-size: clamp(18px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .slide-content p {
      font-size: clamp(14px, 2vw, 20px);
      color: #888;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 12px;
    }

    .slide-content ul {
      list-style: none;
      text-align: left;
      display: inline-block;
      margin: 8px auto;
    }

    .slide-content ul li {
      font-size: clamp(14px, 1.8vw, 18px);
      color: #888;
      line-height: 1.8;
      padding-left: 20px;
      position: relative;
    }

    .slide-content ul li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: #4a9eff;
    }

    .slide-content code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.9em;
      background: #1a1a1a;
      color: #7c5af5;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .slide-content pre {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 20px 24px;
      text-align: left;
      overflow-x: auto;
      margin: 16px auto;
      max-width: 560px;
    }

    .slide-content pre code {
      background: none;
      color: #ccc;
      padding: 0;
      font-size: clamp(12px, 1.4vw, 14px);
      line-height: 1.6;
    }

    .slide-content strong { color: #fff; font-weight: 700; }
    .slide-content em { color: #aaa; font-style: italic; }

    /* Counter */
    #counter {
      position: fixed;
      top: 24px;
      right: 32px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #333;
      z-index: 10;
      pointer-events: none;
    }

    /* Nav hint */
    #nav-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: #222;
      z-index: 10;
      pointer-events: none;
      transition: color 200ms;
    }

    body:hover #nav-hint { color: #444; }
  </style>
</head>
<body>
  <div id="counter"></div>
  <div id="deck"></div>
  <div id="nav-hint">← → or click</div>

  <script src="slides.js"></script>
  <script>
    // JS goes here in Task 3
  </script>
</body>
</html>
